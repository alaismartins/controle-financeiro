<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

/* ------------------------------------------------------------------ */
/*  Armazenamento local (dados ficam salvos neste navegador)           */
/* ------------------------------------------------------------------ */

const STORAGE_KEY = "financas-lais-v1";

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
}

/* ------------------------------------------------------------------ */
/*  Utilidades                                                         */
/* ------------------------------------------------------------------ */

const WEEKS_PER_MONTH = 4.345;

const uid = () => Math.random().toString(36).slice(2, 10);
const fmt = (v) =>
  new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(Number(v) || 0);
const todayISO = () => new Date().toISOString().slice(0, 10);
const parseD = (s) => new Date((s || todayISO()) + "T00:00:00");
const addMonths = (d, n) => new Date(d.getFullYear(), d.getMonth() + n, 1);
const monthStart = (d) => new Date(d.getFullYear(), d.getMonth(), 1);
const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);

const inSector = (item, sector) => (sector === "ambos" ? true : item.sector === sector);

function defaultData() {
  return {
    services: [],
    fixedFields: [
      { id: uid(), sector: "pessoal", type: "expense", name: "Ônibus", value: 0, recurring: false, start: "", end: "" },
      { id: uid(), sector: "pessoal", type: "expense", name: "Produtos de Beleza", value: 0, recurring: false, start: "", end: "" },
      { id: uid(), sector: "profissional", type: "expense", name: "Aluguel (salão)", value: 0, recurring: false, start: "", end: "" },
      { id: uid(), sector: "profissional", type: "expense", name: "Parcelas maquiagem", value: 0, recurring: false, start: "", end: "" },
    ],
    transactions: [],
    savingsGoals: [],
    materialExpenses: [],
  };
}

function sumForRange(transactions, fixedFields, sector, start, end) {
  let income = 0, expense = 0;
  transactions.forEach((t) => {
    if (!inSector(t, sector)) return;
    const d = parseD(t.date);
    if (d >= start && d < end) {
      if (t.type === "income") income += Number(t.value); else expense += Number(t.value);
    }
  });
  fixedFields.forEach((f) => {
    if (!inSector(f, sector) || !f.recurring || !f.start) return;
    const fStart = monthStart(parseD(f.start));
    const fEnd = f.end ? monthStart(parseD(f.end)) : monthStart(new Date(2100, 0, 1));
    let cursor = monthStart(start);
    while (cursor < end) {
      if (cursor >= fStart && cursor <= fEnd) {
        if (f.type === "income") income += Number(f.value); else expense += Number(f.value);
      }
      cursor = addMonths(cursor, 1);
    }
  });
  return { income, expense, saldo: income - expense };
}

function getEarliestDate(data, sector) {
  const dates = [];
  data.transactions.filter((t) => inSector(t, sector)).forEach((t) => dates.push(parseD(t.date)));
  data.fixedFields.filter((f) => inSector(f, sector) && f.recurring && f.start).forEach((f) => dates.push(parseD(f.start)));
  if (!dates.length) return monthStart(new Date());
  return new Date(Math.min(...dates.map((d) => d.getTime())));
}

function getPeriods(granularity, count) {
  const now = new Date();
  const periods = [];
  if (granularity === "mensal") {
    for (let i = count - 1; i >= 0; i--) {
      const start = addMonths(monthStart(now), -i);
      const end = addMonths(start, 1);
      periods.push({ label: cap(start.toLocaleDateString("pt-BR", { month: "short", year: "2-digit" })), start, end });
    }
  } else if (granularity === "trimestral") {
    const qStart = Math.floor(now.getMonth() / 3) * 3;
    for (let i = count - 1; i >= 0; i--) {
      const start = new Date(now.getFullYear(), qStart - i * 3, 1);
      const end = addMonths(start, 3);
      periods.push({ label: `T${Math.floor(start.getMonth() / 3) + 1}/${String(start.getFullYear()).slice(2)}`, start, end });
    }
  } else if (granularity === "semestral") {
    const sStart = Math.floor(now.getMonth() / 6) * 6;
    for (let i = count - 1; i >= 0; i--) {
      const start = new Date(now.getFullYear(), sStart - i * 6, 1);
      const end = addMonths(start, 6);
      periods.push({ label: `S${Math.floor(start.getMonth() / 6) + 1}/${String(start.getFullYear()).slice(2)}`, start, end });
    }
  } else {
    for (let i = count - 1; i >= 0; i--) {
      const y = now.getFullYear() - i;
      periods.push({ label: `${y}`, start: new Date(y, 0, 1), end: new Date(y + 1, 0, 1) });
    }
  }
  return periods;
}

/*  Tokens visuais                                                     */

  positiveSoft: "#E7EFE7",

/* ------------------------------------------------------------------ */
/*  Logo                                                                */
/* ------------------------------------------------------------------ */

function Logo({ size = 34 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="18" stroke={C.border} strokeWidth="1.4" />
      <path d="M20 8C28 12 32 20 20 32C8 20 12 12 20 8Z" fill={C.accent} />

function Header({ tab, setTab }) {

  return (

        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <Logo />
          <div>
            <div className="cf-serif" style={{ fontSize: 17, fontWeight: 600, lineHeight: 1.1 }}>Controle Financeiro</div>
            <div style={{ fontSize: 12, color: C.textSoft, letterSpacing: "0.02em" }}>Laís Martins</div>
          </div>
        </div>
        <nav className="cf-nav" style={{ display: "flex", gap: 26 }}>
          {tabs.map((t) => (
            <button
              key={t.id}
              onClick={() => setTab(t.id)}
              className="cf-btn cf-tabbtn"
              style={{

/* ------------------------------------------------------------------ */
/*  Componentes pequenos                                               */
/* ------------------------------------------------------------------ */

function StatusBadge({ saldo }) {
  const positive = saldo > 0.004;
  const negative = saldo < -0.004;
  const label = positive ? "Situação positiva" : negative ? "Situação negativa" : "Situação estável";
  const bg = positive ? C.positiveSoft : negative ? C.negativeSoft : C.goldSoft;
  const fg = positive ? C.positive : negative ? C.negative : C.gold;
  return (
    <span style={{ background: bg, color: fg, fontSize: 12.5, fontWeight: 600, padding: "5px 12px", borderRadius: 999 }}>
      {label}
    </span>
  );
}

function StatPair({ label, value, tone }) {
  const color = tone === "up" ? C.positive : tone === "down" ? C.negative : C.text;
  return (
    <div>
      <div style={{ fontSize: 12, color: C.textSoft, marginBottom: 3 }}>{label}</div>
      <div style={{ fontSize: 15.5, fontWeight: 600, color }}>{fmt(value)}</div>
    </div>
  );
}

function StatusCard({ title, monthLabel, income, expense, saldo, accumulated }) {
  return (
    <section
      className="cf-fadein"
      style={{
        background: C.surface, border: `1px solid ${C.border}`, borderRadius: 20,
        padding: "clamp(18px, 5vw, 26px) clamp(16px, 5vw, 28px)", boxShadow: "0 8px 24px rgba(46,36,48,0.06)",
      }}
    >
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12 }}>
        <div>
          <div style={{ fontSize: 13, color: C.textSoft }}>{title} · {monthLabel}</div>
          <div className="cf-serif cf-balance" style={{ fontSize: "clamp(28px, 8vw, 42px)", fontWeight: 500, marginTop: 4, color: saldo < 0 ? C.negative : C.text }}>
            {fmt(saldo)}
          </div>
        </div>
        <StatusBadge saldo={saldo} />
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(120px, 1fr))", gap: 16, marginTop: 22 }}>
        <StatPair label="Entradas no mês" value={income} tone="up" />
        <StatPair label="Saídas no mês" value={expense} tone="down" />
        <StatPair label="Saldo acumulado" value={accumulated} />
      </div>
    </section>

}

function SectionCard({ title, subtitle, children }) {
  return (
    <section style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: "clamp(14px, 4vw, 20px) clamp(14px, 4vw, 22px)" }}>
      <div style={{ marginBottom: 16 }}>
        <h3 className="cf-serif" style={{ fontSize: 17, fontWeight: 600, margin: 0 }}>{title}</h3>
        {subtitle && <p style={{ fontSize: 12.5, color: C.textSoft, margin: "4px 0 0" }}>{subtitle}</p>}
      </div>
      {children}
    </section>
  );
}

/* ------------------------------------------------------------------ */
/*  Gráfico de barras (SVG próprio, sem biblioteca externa)             */
/* ------------------------------------------------------------------ */

function MiniBarChart({ data }) {
  const max = Math.max(1, ...data.flatMap((d) => [d.Entradas, d.Saídas]));
  const w = 640, h = 250, padL = 54, padB = 34, padT = 10, padR = 10;
  const chartW = w - padL - padR;
  const chartH = h - padT - padB;
  const groupW = data.length ? chartW / data.length : chartW;
  const barW = Math.min(22, groupW / 3);
  const yTicks = 4;
  const niceMax = Math.ceil(max / 5) * 5 || 5;

  return (
    <div>
      <div style={{ overflowX: "auto" }}>
        <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", minWidth: 480, height: 250 }}>
          {Array.from({ length: yTicks + 1 }).map((_, i) => {
            const y = padT + chartH - (chartH / yTicks) * i;
            const val = (niceMax / yTicks) * i;
            return (
              <g key={i}>
                <line x1={padL} x2={w - padR} y1={y} y2={y} stroke={C.borderSoft} strokeWidth="1" />
                <text x={padL - 8} y={y + 4} fontSize="10" fill={C.textSoft} textAnchor="end">
                  {val >= 1000 ? (val / 1000).toFixed(1) + "k" : val}
                </text>
              </g>
            );
          })}
          {data.map((d, i) => {
            const gx = padL + i * groupW;
            const hIn = (d.Entradas / niceMax) * chartH;
            const hOut = (d.Saídas / niceMax) * chartH;
            const xIn = gx + groupW / 2 - barW - 2;
            const xOut = gx + groupW / 2 + 2;
            return (
              <g key={i}>
                <rect x={xIn} y={padT + chartH - hIn} width={barW} height={Math.max(hIn, 0)} fill={C.positive} rx="3">
                  <title>{`Entradas: ${fmt(d.Entradas)}`}</title>
                </rect>
                <rect x={xOut} y={padT + chartH - hOut} width={barW} height={Math.max(hOut, 0)} fill={C.negative} rx="3">
                  <title>{`Saídas: ${fmt(d.Saídas)}`}</title>
                </rect>
                <text x={gx + groupW / 2} y={h - 12} fontSize="11" fill={C.textSoft} textAnchor="middle">{d.name}</text>
              </g>
            );
          })}
        </svg>
      </div>
      <div style={{ display: "flex", gap: 16, marginTop: 6, fontSize: 12, color: C.textSoft }}>
        <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 10, height: 10, borderRadius: 3, background: C.positive, display: "inline-block" }} />Entradas</span>
        <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 10, height: 10, borderRadius: 3, background: C.negative, display: "inline-block" }} />Saídas</span>
      </div>
    </div>
  );
}

function StatsChart({ data, sector }) {
  const [gran, setGran] = useState("mensal");
  const counts = { mensal: 6, trimestral: 4, semestral: 4, anual: 5 };
  const chartData = useMemo(() => {
    const periods = getPeriods(gran, counts[gran]);
    return periods.map((p) => {
      const s = sumForRange(data.transactions, data.fixedFields, sector, p.start, p.end);
      return { name: p.label, Entradas: Math.round(s.income * 100) / 100, Saídas: Math.round(s.expense * 100) / 100 };
    });
  }, [data, sector, gran]);

  const opts = [
    { id: "mensal", label: "Mensal" },
    { id: "trimestral", label: "Trimestral" },
    { id: "semestral", label: "Semestral" },
    { id: "anual", label: "Anual" },
  ];

  return (
    <SectionCard title="Estatísticas" subtitle="Entradas e saídas por período">
      <div style={{ display: "flex", gap: 8, marginBottom: 18, flexWrap: "wrap" }}>
        {opts.map((o) => (
          <button
            key={o.id}
            onClick={() => setGran(o.id)}
            className="cf-btn"
            style={{
              background: gran === o.id ? C.accent : C.borderSoft,
              color: gran === o.id ? "#fff" : C.text,
              fontSize: 12.5, padding: "6px 13px", borderRadius: 999,
            }}
          >
            {o.label}
          </button>
        ))}
      </div>
      <MiniBarChart data={chartData} />
    </SectionCard>
  );
}

/* ------------------------------------------------------------------ */
/*  Lançamento rápido                                                   */
/* ------------------------------------------------------------------ */

function QuickAddForm({ sector, data, actions }) {
  const [type, setType] = useState("income");
  const [name, setName] = useState("");
  const [value, setValue] = useState("");
  const [date, setDate] = useState(todayISO());

  const templates =
    type === "income" && sector === "profissional"
      ? data.services.map((s) => ({ id: s.id, name: s.name, value: s.price }))
      : data.fixedFields.filter((f) => f.sector === sector && f.type === type);

  const applyTemplate = (t) => {
    setName(t.name);
    setValue(String(t.value));
  };

  const submit = () => {
    const v = parseFloat(String(value).replace(",", "."));
    if (!v || v <= 0) return;
    actions.addTransaction({
      sector, type, date,
      name: name.trim() || (type === "income" ? "Receita" : "Despesa"),
      value: v,
    });
    setName(""); setValue(""); setDate(todayISO());
  };

  return (
    <SectionCard title="Novo lançamento">
      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        {[{ id: "income", label: "Entrada" }, { id: "expense", label: "Saída" }].map((o) => (
          <button key={o.id} onClick={() => { setType(o.id); setName(""); setValue(""); }} className="cf-btn"
            style={{
              flex: 1, padding: "9px 0", borderRadius: 10, fontSize: 13.5,
              background: type === o.id ? (o.id === "income" ? C.positiveSoft : C.negativeSoft) : C.borderSoft,
              color: type === o.id ? (o.id === "income" ? C.positive : C.negative) : C.textSoft,
            }}
          >
            {o.label}
          </button>
        ))}
      </div>

      {templates.length > 0 && (
        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 12, color: C.textSoft, marginBottom: 6 }}>Atalhos</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
            {templates.map((t) => (
              <button key={t.id} onClick={() => applyTemplate(t)} className="cf-btn"
                style={{ background: C.accentSoft, color: C.accent, fontSize: 12, padding: "6px 11px", borderRadius: 999 }}>
                {t.name} · {fmt(t.value)}
              </button>
            ))}
          </div>
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 10 }}>
        <input className="cf-input" placeholder={`Descrição (padrão: ${type === "income" ? "Receita" : "Despesa"})`} value={name} onChange={(e) => setName(e.target.value)} />
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(130px, 1fr))", gap: 10 }}>
          <input className="cf-input" type="number" min="0" step="0.01" placeholder="Valor (R$)" value={value} onChange={(e) => setValue(e.target.value)} />
          <input className="cf-input" type="date" value={date} onChange={(e) => setDate(e.target.value)} />
        </div>
        <button onClick={submit} className="cf-btn" style={{ background: C.text, color: "#fff", borderRadius: 10, padding: "10px 0", fontSize: 13.5, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
          <IconPlus size={15} /> Adicionar
        </button>
      </div>
    </SectionCard>
  );
}

/* ------------------------------------------------------------------ */
/*  Lista de lançamentos                                                */
/* ------------------------------------------------------------------ */

function TransactionRow({ t, actions, showSector }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(t);

  useEffect(() => setDraft(t), [t]);

  if (editing) {
    return (

function goalCurrent(data, goalId) {
  return data.transactions
    .filter((t) => t.goalId === goalId)
    .reduce((s, t) => s + (t.type === "expense" ? Number(t.value) : -Number(t.value)), 0);
}

        style={{ marginTop: 14, background: "transparent", color: C.accent, fontSize: 13, padding: "6px 0", display: "flex", alignItems: "center", gap: 6 }}>
        <IconPlus size={15} /> Nova reserva
      </button>
    </SectionCard>
  );

function GoalCard({ g, data, actions }) {
  const [editingName, setEditingName] = useState(false);
  const [name, setName] = useState(g.name);
  const [amount, setAmount] = useState("");
  const current = goalCurrent(data, g.id);
  const target = parseFloat(g.target) || 0;
  const pct = target > 0 ? Math.min(100, Math.round((current / target) * 100)) : null;

  const move = (type) => {
    const v = parseFloat(String(amount).replace(",", "."));
    if (!v || v <= 0) return;
    actions.addTransaction({
      sector: "pessoal", type, date: todayISO(),
      name: `${type === "expense" ? "Reserva" : "Retirada"}: ${g.name}`,
      value: v, goalId: g.id,
    });
    setAmount("");
  };

  return (
    <div style={{ border: `1px solid ${C.border}`, borderRadius: 14, padding: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        {editingName ? (
          <div style={{ display: "flex", gap: 4, flex: 1 }}>
            <input className="cf-input" style={{ fontSize: 13.5 }} value={name} onChange={(e) => setName(e.target.value)} autoFocus />
            <button className="cf-icon-btn" onClick={() => { actions.updateGoal(g.id, { name: name.trim() || g.name }); setEditingName(false); }}><IconCheck size={14} /></button>
          </div>
        ) : (
          <div className="cf-serif" style={{ fontSize: 15.5, fontWeight: 600, display: "flex", alignItems: "center", gap: 6 }}>
            {g.name}
            <button className="cf-icon-btn" onClick={() => setEditingName(true)}><IconPencil size={12} /></button>
          </div>
        )}
        <button className="cf-icon-btn" onClick={() => actions.deleteGoal(g.id)}><IconTrash size={14} /></button>
      </div>

      <div className="cf-serif" style={{ fontSize: 22, fontWeight: 600, color: C.gold }}>{fmt(current)}</div>

      <div style={{ marginTop: 8 }}>
        <input className="cf-input" style={{ fontSize: 12 }} type="number" min="0" step="0.01" placeholder="Meta (opcional)" value={g.target}
          onChange={(e) => actions.updateGoal(g.id, { target: e.target.value })} />
      </div>

      {pct !== null && (
        <div style={{ marginTop: 10 }}>
          <div style={{ height: 6, background: C.borderSoft, borderRadius: 999, overflow: "hidden" }}>
            <div style={{ height: "100%", width: `${pct}%`, background: C.gold }} />
          </div>
          <div style={{ fontSize: 11, color: C.textSoft, marginTop: 4 }}>{pct}% de {fmt(target)}</div>
        </div>
      )}

      <div style={{ display: "flex", gap: 6, marginTop: 12 }}>
        <input className="cf-input" style={{ fontSize: 12.5 }} type="number" min="0" step="0.01" placeholder="Valor" value={amount} onChange={(e) => setAmount(e.target.value)} />
        <button className="cf-icon-btn" title="Guardar" onClick={() => move("expense")} style={{ background: C.goldSoft, color: C.gold }}><IconPlus size={15} /></button>
        <button className="cf-icon-btn" title="Retirar" onClick={() => move("income")} style={{ background: C.borderSoft }}><IconMinus size={15} /></button>
      </div>
    </div>
  );
}

function useSectorTotals(data, sector) {
  return useMemo(() => {
    const now = new Date();
    const monthRange = { start: monthStart(now), end: addMonths(monthStart(now), 1) };
    const month = sumForRange(data.transactions, data.fixedFields, sector, monthRange.start, monthRange.end);
    const earliest = getEarliestDate(data, sector);
    const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    const acc = sumForRange(data.transactions, data.fixedFields, sector, earliest, tomorrow);
    return { month, accumulated: acc.saldo, monthLabel: cap(now.toLocaleDateString("pt-BR", { month: "long", year: "numeric" })) };
  }, [data, sector]);
}

function SetorView({ sector, data, actions }) {

      <div className="cf-grid2" style={{ display: "grid", gridTemplateColumns: "1fr 1.5fr", gap: 20, alignItems: "start" }}>
        <QuickAddForm sector={sector} data={data} actions={actions} />

      )}
      {sector === "profissional" && <MaterialCalculator data={data} actions={actions} />}

      {sector === "pessoal" && (

          <SavingsGoals data={data} actions={actions} />

        </div>
      )}
    </div>
  );
}

function GeralView({ data, actions }) {
  const t = useSectorTotals(data, "ambos");
  const pessoal = useSectorTotals(data, "pessoal");
  const profissional = useSectorTotals(data, "profissional");

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <StatusCard title="Visão geral" monthLabel={t.monthLabel} income={t.month.income} expense={t.month.expense} saldo={t.month.saldo} accumulated={t.accumulated} />

      <div className="cf-grid2" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
        <SectionCard title="Pessoal" subtitle={t.monthLabel}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <StatPair label="Saldo do mês" value={pessoal.month.saldo} tone={pessoal.month.saldo >= 0 ? "up" : "down"} />
            <StatusBadge saldo={pessoal.month.saldo} />
          </div>
        </SectionCard>
        <SectionCard title="Profissional" subtitle={t.monthLabel}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <StatPair label="Saldo do mês" value={profissional.month.saldo} tone={profissional.month.saldo >= 0 ? "up" : "down"} />
            <StatusBadge saldo={profissional.month.saldo} />
          </div>
        </SectionCard>
      </div>

      <StatsChart data={data} sector="ambos" />
      <TransactionsList sector="ambos" data={data} actions={actions} limit={16} showSector />
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  App                                                                 */
/* ------------------------------------------------------------------ */

function App() {
  const [data, setData] = useState(() => loadData() || defaultData());
  const [tab, setTab] = useState("geral");

  useEffect(() => { document.title = "Controle Financeiro - Laís Martins"; }, []);
  useEffect(() => { saveData(data); }, [data]);

  const actions = useMemo(() => ({
    addTransaction: (tx) => setData((p) => ({ ...p, transactions: [...p.transactions, { id: uid(), ...tx }] })),
    updateTransaction: (id, patch) => setData((p) => ({ ...p, transactions: p.transactions.map((t) => (t.id === id ? { ...t, ...patch } : t)) })),
    deleteTransaction: (id) => setData((p) => ({ ...p, transactions: p.transactions.filter((t) => t.id !== id) })),

    addService: (s) => setData((p) => ({ ...p, services: [...p.services, { id: uid(), ...s }] })),
    updateService: (id, patch) => setData((p) => ({ ...p, services: p.services.map((s) => (s.id === id ? { ...s, ...patch } : s)) })),
    deleteService: (id) => setData((p) => ({ ...p, services: p.services.filter((s) => s.id !== id) })),

    addFixedField: (f) => setData((p) => ({ ...p, fixedFields: [...p.fixedFields, { id: uid(), ...f }] })),
    updateFixedField: (id, patch) => setData((p) => ({ ...p, fixedFields: p.fixedFields.map((f) => (f.id === id ? { ...f, ...patch } : f)) })),
    deleteFixedField: (id) => setData((p) => ({ ...p, fixedFields: p.fixedFields.filter((f) => f.id !== id) })),

    addMaterial: (m) => setData((p) => ({ ...p, materialExpenses: [...p.materialExpenses, { id: uid(), ...m }] })),
    updateMaterial: (id, patch) => setData((p) => ({ ...p, materialExpenses: p.materialExpenses.map((m) => (m.id === id ? { ...m, ...patch } : m)) })),
    deleteMaterial: (id) => setData((p) => ({ ...p, materialExpenses: p.materialExpenses.filter((m) => m.id !== id) })),

    addGoal: (g) => setData((p) => ({ ...p, savingsGoals: [...p.savingsGoals, { id: uid(), ...g }] })),
    updateGoal: (id, patch) => setData((p) => ({ ...p, savingsGoals: p.savingsGoals.map((g) => (g.id === id ? { ...g, ...patch } : g)) })),
    deleteGoal: (id) => setData((p) => ({ ...p, savingsGoals: p.savingsGoals.filter((g) => g.id !== id), transactions: p.transactions.filter((t) => t.goalId !== id) })),
  }), []);

  return (
    <div>
      <Header tab={tab} setTab={setTab} />
      <main className="cf-main" style={{ maxWidth: 1100, margin: "0 auto", padding: "26px 24px 60px" }}>
        {tab === "geral" && <GeralView data={data} actions={actions} />}
        {tab === "pessoal" && <SetorView sector="pessoal" data={data} actions={actions} />}
        {tab === "profissional" && <SetorView sector="profissional" data={data} actions={actions} />}
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
